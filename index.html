
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17251f">
<title>Mijn PA</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 28px 20px;
  background: #f5f3ed; color: #26352d;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
main { max-width: 520px; margin: auto; }
.tag { color: #718276; font-size: 12px; letter-spacing: 2px; }
h1 { font-size: 38px; margin-bottom: 8px; }
p { line-height: 1.6; }
label { display: block; margin: 22px 0 8px; font-weight: 600; }
input, select, button {
  width: 100%; padding: 15px; border-radius: 12px;
  font-size: 16px; margin-bottom: 12px;
}
input, select { border: 1px solid #c9cec6; background: white; }
button {
  border: 0; background: #263d31; color: white;
  font-weight: 600;
}
.place {
  background: white; padding: 16px;
  margin-top: 12px; border-radius: 12px;
}
.place h3 { margin: 0 0 6px; }
.place p { margin: 4px 0; font-size: 14px; }
#message { color: #526b59; }
</style>
</head>
<body>
<main>
<div class="tag">JOUW PERSOONLIJKE ASSISTENT</div>
<h1>Mijn PA</h1>
<p>Ontdek bijzondere plekken, goede adressen en verborgen pareltjes.</p>

<label for="city">Welke stad wil je ontdekken?</label>
<input id="city" value="Haarlem" placeholder="Bijvoorbeeld Haarlem">

<label for="category">Wat zoek je?</label>
<select id="category">
<option value="all">Alles</option>
<option value="restaurant">Restaurants</option>
<option value="bar">Bars en pubs</option>
<option value="cafe">Koffie en cafés</option>
<option value="attraction">Bezienswaardigheden</option>
</select>

<button id="searchButton" onclick="searchPlaces()">Ontdek deze stad</button>
<p id="message" aria-live="polite"></p>
<div id="results"></div>
</main>

<script>
async function getJSON(url, options = {}) {
  const response = await fetch(url, options);
  if (!response.ok) {
    throw new Error('Zoekdienst reageert met foutcode ' + response.status);
  }
  return response.json();
}

async function searchPlaces() {
  const city = document.getElementById('city').value.trim();
  const category = document.getElementById('category').value;
  const message = document.getElementById('message');
  const results = document.getElementById('results');
  const button = document.getElementById('searchButton');

  if (!city) {
    message.textContent = 'Vul eerst een stad in.';
    return;
  }

  button.disabled = true;
  message.textContent = 'We zoeken maximaal 10 plekken in ' + city + '...';
  results.innerHTML = '';

  try {
    const geoURL = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='
      + encodeURIComponent(city);

    const places = await getJSON(geoURL);

    if (!places.length) throw new Error('Stad niet gevonden.');

    const p = places[0];
    const south = Number(p.boundingbox[0]);
    const north = Number(p.boundingbox[1]);
    const west = Number(p.boundingbox[2]);
    const east = Number(p.boundingbox[3]);

    const filters = {
      restaurant: 'node["amenity"="restaurant"]',
      bar: 'node["amenity"~"bar|pub"]',
      cafe: 'node["amenity"="cafe"]',
      attraction: 'node["tourism"~"attraction|museum|viewpoint"]'
    };

    const filter = category === 'all'
      ? 'node["amenity"~"restaurant|bar|pub|cafe"],node["tourism"~"attraction|museum|viewpoint"]'
      : filters[category];

    const query = '[out:json][timeout:20];(' +
      filter + '(' + south + ',' + west + ',' + north + ',' + east +
      '););out tags 10;';

    const servers = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter'
    ];

    let data = null;
    let lastError = null;

    for (const server of servers) {
      try {
        data = await getJSON(server, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(query)
        });
        break;
      } catch (error) {
        lastError = error;
      }
    }

    if (!data) throw lastError || new Error('Zoekdiensten niet beschikbaar.');

    const found = data.elements.filter(item => item.tags && item.tags.name);

    if (!found.length) {
      message.textContent = 'Geen benoemde plekken gevonden in ' + city + '.';
      return;
    }

    message.textContent = Math.min(found.length, 10) +
      ' plekken gevonden in ' + city + '.';

    found.slice(0, 10).forEach(item => {
      const card = document.createElement('div');
      card.className = 'place';

      const title = document.createElement('h3');
      title.textContent = item.tags.name;

      const type = document.createElement('p');
      type.textContent = item.tags.amenity || item.tags.tourism || 'Locatie';

      const address = document.createElement('p');
      address.textContent = [
        item.tags['addr:street'],
        item.tags['addr:housenumber']
      ].filter(Boolean).join(' ') || 'Adres niet beschikbaar';

      card.append(title, type, address);
      results.appendChild(card);
    });

  } catch (error) {
    message.textContent = 'Zoeken lukt momenteel niet: ' + error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
