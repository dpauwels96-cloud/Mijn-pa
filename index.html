
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn PA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #292929;
      margin: 0;
      padding: 24px 16px;
    }
    main {
      max-width: 600px;
      margin: auto;
    }
    h1 { color: #284c43; }
    .intro { color: #555; line-height: 1.5; }
    label {
      display: block;
      font-weight: bold;
      margin: 20px 0 8px;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }
    input, select {
      border: 1px solid #bbb;
      background: white;
    }
    button {
      margin-top: 20px;
      border: 0;
      background: #284c43;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #status { margin-top: 20px; }
    .place {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 2px 8px #0000000d;
    }
    .place h3 { margin: 0 0 8px; }
    .category {
      color: #52796f;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .address {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<main>
  <h1>Mijn PA</h1>
  <p class="intro">
    Jouw persoonlijke assistent om leuke restaurants,
    bars, koffiebars en bezienswaardigheden te ontdekken.
  </p>

  <label for="city">In welke stad wil je zoeken?</label>
  <input id="city" type="text" placeholder="Bijvoorbeeld Haarlem">

  <label for="category">Wat zoek je?</label>
  <select id="category">
    <option value="restaurant">Restaurants</option>
    <option value="bar">Bars</option>
    <option value="specialty coffee">Specialty coffee</option>
    <option value="attraction">Bezienswaardigheden</option>
  </select>

  <button id="searchButton" onclick="searchPlaces()">
    Zoek locaties
  </button>

  <div id="status" aria-live="polite"></div>
  <div id="results"></div>
</main>

<script>

async function searchPlaces() {
  const city = document.getElementById("city").value.trim();
  const category = document.getElementById("category").value;
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const button = document.getElementById("searchButton");

  results.innerHTML = "";

  if (!city) {
    status.textContent = "Vul eerst een stad in.";
    return;
  }

  button.disabled = true;
  status.textContent = "Even zoeken...";

  try {
    const query = encodeURIComponent(city);
    const url = "https://photon.komoot.io/api/?q=" +
      query + "&limit=10&lang=nl";
    
status.textContent = "URL: " + url;
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("HTTP-fout: " + response.status);
    }

    const data = await response.json();
    const places = data.features || [];

    if (places.length === 0) {
      status.textContent = "Geen locaties gevonden.";
      return;
    }

    status.textContent =
      places.length + " zoekresultaten gevonden.";

    places.slice(0, 10).forEach(place => {
      const p = place.properties || {};

      const name = p.name || "Naam niet beschikbaar";
      const address = [
        p.street,
        p.housenumber,
        p.postcode,
        p.city || p.locality
      ].filter(Boolean).join(", ");

      const card = document.createElement("article");
      card.className = "place";

      const heading = document.createElement("h3");
      heading.textContent = name;

      const type = document.createElement("div");
      type.className = "category";
      type.textContent = category;

      const location = document.createElement("p");
      location.className = "address";
      location.textContent =
        address || "Adres niet beschikbaar";

      card.append(heading, type, location);
      results.appendChild(card);
    });

  } catch (error) {
    status.textContent =
      "Technische fout: " + error.name + " – " + error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
